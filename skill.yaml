schema: skill-manifest/v1
id: lov-rich-export
version: 0.2.1
runtime: skill-runtime/v1
context:
  profile:
    fields:
      - path: identity.name
        required: false
        question: "如果导出文件需要品牌身份，请提供名称。"
  preferences:
    namespace: rich_export
    fields:
      - path: default_formats
        required: false
        question: "是否有默认导出格式组合？"
      - path: user.language
        required: false
        question: "导出说明使用哪种语言？"
  interaction:
    ask_missing: true
    max_questions: 1
